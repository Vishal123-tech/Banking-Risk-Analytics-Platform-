name: Validate analytics project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m py_compile app.py risk_modeling/pd_model.py data/generate_synthetic_portfolio.py

      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            summary=$(tr '\n' ' ' < pytest.log | cut -c1-900)
            echo "::error file=.github/workflows/ci.yml,line=29::$summary"
            exit "$test_status"
          fi
